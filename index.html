<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Aplica o tema salvo antes da primeira pintura (sem flash). Sem escolha salva = segue o sistema.
    (function () {
      try {
        var t = localStorage.getItem("cd-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <meta name="dashboard-build" content="192" />
  <title>Dashboard de Publisher</title>
  <link rel="stylesheet" href="/styles.css?v=192" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div id="root"></div>
  <script type="module" src="/app.js?v=192"></script>
</body>
</html>
